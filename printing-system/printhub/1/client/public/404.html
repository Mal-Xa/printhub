<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | Sora Print Hub</title>
    <meta name="robots" content="noindex">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 420px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 72px;
        line-height: 1;
      }

      h2 {
        margin: 20px 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        margin-top: 28px;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        background: #4f46e5;
        padding: 0 18px;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you are looking for does not exist or has moved.</p>
      <a href="/">Go home</a>
    </main>
  </body>
</html>
